name: Public CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Boundary, packages, frontend, docs, and Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      ASTRO_TELEMETRY_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check out public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install checksum-pinned Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks-${GITLEAKS_VERSION}"

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --proto '=https' \
            --tlsv1.2 \
            --connect-timeout 10 \
            --max-time 60 \
            --retry 0 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | sha256sum --check --status
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" gitleaks
          chmod 0755 "$install_dir/gitleaks"
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"

      - name: Reject secrets from the complete Git history
        shell: bash
        run: |
          set -euo pipefail
          if ! gitleaks git "$GITHUB_WORKSPACE" \
            --log-opts='--all --full-history HEAD' \
            --redact=100 \
            --no-banner \
            --no-color \
            --timeout=120 \
            >/dev/null 2>&1; then
            echo '::error::The redacted full-history secret scan failed. Reproduce only in an approved local environment; CI suppresses finding details.'
            exit 1
          fi
          echo 'Redacted full-history secret scan passed.'

      - name: Verify public boundary before dependency installation
        run: node scripts/check-public-boundary.mjs

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify public source and production dependencies
        run: pnpm ci:public

      - name: Build and dry-run Cloudflare artifacts on Linux
        run: pnpm ci:cloudflare
