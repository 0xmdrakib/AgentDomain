name: Publish npm packages

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish public packages
    if: github.ref == 'refs/heads/main' && github.repository == '0xmdrakib/AgentDomain'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify public boundary before dependency installation
        run: node scripts/check-public-boundary.mjs

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install an OIDC-capable npm CLI
        run: npm install --global 'npm@11.5.1'

      - run: pnpm install --frozen-lockfile

      - name: Reject high-severity production dependency findings
        run: pnpm audit:production:high

      - run: pnpm --filter @agentdomain/shared build
      - run: pnpm --filter @agentdomain/sdk build
      - run: pnpm --filter @agentdomain/mcp-server build
      - run: pnpm --filter @agentdomain/agentkit-plugin build
      - run: pnpm --filter @agentdomain/eliza-plugin build

      - name: Publish packages
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.release"

          publish_if_needed() {
            local package_dir="$1"
            local name
            local version
            local slug
            local archive

            name="$(node -p "require('./${package_dir}/package.json').name")"
            version="$(node -p "require('./${package_dir}/package.json').version")"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "Skipping ${name}@${version}; it is already published."
              return
            fi

            pnpm --dir "$package_dir" pack --pack-destination "$GITHUB_WORKSPACE/.release"
            slug="${name#@}"
            slug="${slug//\//-}"
            archive="$GITHUB_WORKSPACE/.release/${slug}-${version}.tgz"
            npm publish "$archive" --access public --provenance
          }

          publish_if_needed packages/shared
          publish_if_needed packages/sdk
          publish_if_needed apps/mcp-server
          publish_if_needed packages/agentkit-plugin
          publish_if_needed packages/eliza-plugin
