version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      public-compatible-updates:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
        # Wallet libraries need separate license and integration review.
        exclude-patterns:
          - '@walletconnect/*'
          - '@reown/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:30'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      # CodeQL subactions share a configuration format and must use the same release.
      codeql-actions:
        patterns:
          - github/codeql-action
          - github/codeql-action/*
      codeql-security-updates:
        applies-to: security-updates
        patterns:
          - github/codeql-action
          - github/codeql-action/*
