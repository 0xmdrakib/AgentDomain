<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="788" height="788" viewBox="233 233 788 788">
<title>Centered logo — corners matched to the white circle surface</title>
<defs>
  <linearGradient id="badge-material" x1="0" y1="0" x2="0.8" y2="1">
    <stop offset="0" stop-color="#fefefe" />
    <stop offset="1" stop-color="#fdfdfd" />
  </linearGradient>
  <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="450" y1="415" x2="804" y2="840">
    <stop offset="0" stop-color="#131413" />
    <stop offset="0.5" stop-color="#141514" />
    <stop offset="1" stop-color="#141413" />
  </linearGradient>
  <filter id="ink-shadow" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation="1.2" result="blur" />
    <feOffset in="blur" dx="-0.6" dy="0.8" result="offset" />
    <feFlood flood-color="#000000" flood-opacity="0.13" />
    <feComposite in2="offset" operator="in" />
    <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
  </filter>
</defs>
<desc>The corrected logo and white circle geometry are unchanged. The circle's white material is extended seamlessly to the four outer corners of the 788 by 788 canvas. Only the darker corner background and badge drop shadow are removed. The black logo, its subtle shadow, and the small black circle retain their original geometry and position.</desc>
<rect id="matched-background" x="233" y="233" width="788" height="788" fill="url(#badge-material)" />
<circle id="badge" cx="627" cy="627" r="394" fill="url(#badge-material)" />
<g id="logo" fill="url(#ink)" filter="url(#ink-shadow)">
